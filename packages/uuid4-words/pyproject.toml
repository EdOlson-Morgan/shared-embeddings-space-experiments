[project]
name = "uuid4-words"
version = "0.1.0"
description = "Deterministic, reversible UUIDv4 <-> word-phrase encoding that costs fewer LLM tokens than the raw hex string."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Edmund Olson-Morgan" }]
requires-python = ">=3.9"
keywords = ["uuid", "uuid4", "tokenizer", "tiktoken", "openai", "llm", "tokens"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai = ["pydantic>=2"]

[project.urls]
Homepage = "https://github.com/EdOlson-Morgan/shared-embeddings-space-experiments/tree/main/packages/uuid4-words"
Repository = "https://github.com/EdOlson-Morgan/shared-embeddings-space-experiments"
Issues = "https://github.com/EdOlson-Morgan/shared-embeddings-space-experiments/issues"
Changelog = "https://github.com/EdOlson-Morgan/shared-embeddings-space-experiments/blob/main/packages/uuid4-words/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "tiktoken>=0.14.0",
    "wordfreq>=3.0.0",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uuid_words"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]
